name: MyMusic
options:
  bundleIdPrefix: com.vrodic
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team here (or in Xcode → Signing & Capabilities). Keep it stable to keep app data across reinstalls.
    DEVELOPMENT_TEAM: DF8G3ZPTZW
targets:
  MyMusic:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vrodic.mymusic
        PRODUCT_NAME: MyMusic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist
  MyMusicServer:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vrodic.mymusic.server
        PRODUCT_NAME: MyMusic Server
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MyMusic Server
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: MyMusic shares your library with your iPhone on the local network.
        CODE_SIGN_ENTITLEMENTS: Mac/MyMusicServer.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        # Signed with your Apple Development cert (not ad hoc) so macOS keeps the
        # Full Disk Access / Local Network grants across rebuilds.
        CODE_SIGN_IDENTITY: "Apple Development"
